<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mintland · Лес</title>
<!--
  Mintland · тема «Лес» (вид сверху; WebGL2 для земли и canvas 2D
  для деревьев)
  Ориентир по стилю: плоская векторная иллюстрация — светло-зелёная
  земля со штрихами травы, поверх неё лес из стилизованных деревьев
  нескольких пород. Вокруг иконок земля остаётся пустой: там, где
  стоит иконка, деревья не растут.
  - Земля: та же, что в теме «Луг», — крупные заливки, зерно бумаги и
    трава параллельными штрихами
  - Деревья: рисуются кодом (не картинками), поэтому произвольного
    размера и перекрашиваются под вариант. Порядок — по глубине:
    дальние деревья мельче и бледнее, ближние крупнее и темнее
  - Вокруг иконок: деревья убираются, остаётся голая земля
-->
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a6c46e; }
  body { font-family: "Cantarell", "Ubuntu", "Noto Sans", "DejaVu Sans", system-ui, sans-serif; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* Деревья рисуются поверх сцены отдельным canvas 2D: WebGL-шейдер земли
     о них ничего не знает, а пятна векторных крон на canvas 2D выходят
     ровнее, чем в шейдере. */
  #trees { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; pointer-events: none; }
  #desktop { position: fixed; left: 0; top: 0; right: 0; bottom: var(--taskbar); }

  .icon {
    position: absolute; width: 76px; padding: 4px 2px 5px;
    display: flex; flex-direction: column; align-items: center;
    border: 1px solid transparent; border-radius: 4px;
    user-select: none; touch-action: none; cursor: default;
  }
  .icon:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.24); }
  .icon.sel { background: rgba(0,120,215,.34); border-color: rgba(140,200,255,.7); }
  .icon.drag { opacity: .88; z-index: 10; transform: scale(1.04); }
  .icon.settle { transition: left .22s cubic-bezier(.2,.8,.3,1), top .22s cubic-bezier(.2,.8,.3,1); }
  .icon.born { animation: born .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes born { from { opacity: 0; transform: scale(.6); } }
  .glyph { width: 48px; height: 48px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)) drop-shadow(3px 6px 4px rgba(90,80,110,.25)); pointer-events: none; }
  .glyph svg { width: 100%; height: 100%; display: block; }
  .label {
    margin-top: 3px; max-width: 72px; font-size: 12px; line-height: 15px; color: #fff; text-align: center;
    text-shadow: 0 0 2px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,.85);
    word-break: break-all; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    pointer-events: none;
  }

  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar);
    background: rgba(28,32,38,.6); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center; z-index: 40;
  }
  #taskbar .apps { display: flex; gap: 4px; }
  #taskbar .app { width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; }
  #taskbar .app:hover { background: rgba(255,255,255,.08); }
  #taskbar .app svg { width: 24px; height: 24px; }
  #clock { position: absolute; right: 14px; color: #fff; font-size: 12px; line-height: 16px; text-align: right; }

  #panel {
    position: fixed; top: 14px; right: 14px; width: 284px; max-height: calc(100vh - var(--taskbar) - 28px); overflow: auto;
    background: rgba(20,52,64,.74); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
    color: #eef6f5; border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    font-size: 12px; line-height: 1.4; box-shadow: 0 12px 32px rgba(0,0,0,.25); z-index: 50;
  }
  #panel.hidden { display: none; }
  /* Режим обоев (?wallpaper=1, страницу загружает рабочий стол):
     настоящие иконки и панель рисует система, не страница */
  body.wall #panel, body.wall #taskbar, body.wall #desktop { display: none; }
  #panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; }
  #panel header b { font-size: 14px; letter-spacing: .06em; }
  #panel header span { margin-left: 8px; opacity: .55; }
  #panel.collapsed .body { display: none; }
  .ibtn { background: none; border: 0; color: inherit; opacity: .6; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; }
  .ibtn:hover { opacity: 1; }
  #panel .body { padding: 0 14px 14px; }
  .sec { margin-top: 12px; }
  .sec > .t { opacity: .6; margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255,255,255,.06); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { background: none; border: 0; color: inherit; padding: 5px 0; border-radius: 5px; cursor: pointer; font: inherit; opacity: .75; white-space: nowrap; }
  .seg button:hover { opacity: 1; }
  .seg button.on { background: rgba(255,255,255,.17); opacity: 1; }
  .slider { margin-top: 9px; }
  .slider .row { display: flex; justify-content: space-between; }
  .slider .row span:last-child { opacity: .6; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #7fe3d6; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggles input { accent-color: #7fe3d6; margin: 0; }
  .btns { display: flex; gap: 6px; }
  .btns button {
    flex: 1; font: inherit; color: inherit; cursor: pointer; padding: 7px 0; border-radius: 7px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.1);
  }
  .btns button:hover { background: rgba(255,255,255,.18); }
  #stats { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: rgba(0,0,0,.25); font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; line-height: 1.6; color: #d4e4e2; }
  #stats .live { color: #7fe3d6; }
  .hint { margin-top: 10px; opacity: .5; font-size: 11px; line-height: 1.6; }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font-size: 16px; }
</style>
</head>

<aside id="panel">

    <div><b>Mintland</b><span>Луг</span></div>

  <div class="body">

      <div class="seg">

      </div>
    </div>

    <div class="sec toggles">
      <label><input type="checkbox" data-key="debug">Показать границы облаков</label>
      <label><input type="checkbox" data-key="snap">Привязка к сетке</label>
      <label><input type="checkbox" data-key="cap30">Ограничить 30 кадров/с</label>
    </div>

<script>
'use strict';

/* ======================================================================
   Параметры
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;
const STEP = 5;
const MORPH_MS = 1800;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');      // режим обоев: страницу открывает рабочий стол
const FREEZE = QS.has('freeze');
// ?variant=… — вариант темы для записи превью и прямых ссылок.
const URL_VARIANT = QS.get('variant');       // заморозка: не крутим requestAnimationFrame, кадр задаётся снаружи (tools/capture-theme.py)
// Значения по умолчанию должны совпадать с полем default темы «Лес»
// в themes.json. Параметры grain и quality не настраиваются.
const P = {
  sigma: 72, warp: 40, edge: 10, cover: 0.3, flow: 1, grain: 1, quality: 2,   // quality 2: рисуем в реальных пикселях экрана — при масштабе 150% картинка не растягивается и остаётся чёткой
  debug: false, snap: true, cap30: true,
  adaptive: 1,
  trees: 700,             // сколько деревьев в лесу
  glade: 46,              // на сколько пикселей от иконки деревья не растут
};
/* Варианты темы. Пока один — `meadow`, повторяющий прежние цвета, поэтому
   вид темы не меняется. Дальше вариант должен менять форму (осень, зима),
   а не только палитру: иначе он читается клоном — проверено на Пляже. */
const VARIANTS = {
  forest: {
    gLight: [0.78, 0.85, 0.55], gMid: [0.64, 0.77, 0.43],
    gDeep:  [0.54, 0.70, 0.37], ink:  [0.26, 0.40, 0.19],
    shadow: [0.56, 0.66, 0.52],
  },
};
let variantId = 'forest';
if (URL_VARIANT && VARIANTS[URL_VARIANT]) variantId = URL_VARIANT;

// Цвета варианта в шейдерные uniforms.
function applyVariant(U) {
  const v = VARIANTS[variantId] || VARIANTS.forest;
  gl.uniform3fv(U.uGLight, v.gLight);
  gl.uniform3fv(U.uGMid, v.gMid);
  gl.uniform3fv(U.uGDeep, v.gDeep);
  gl.uniform3fv(U.uInk, v.ink);
  gl.uniform3fv(U.uShadow, v.shadow);
}

const DEFAULTS = Object.assign({}, P);
const DISPLAY_KEYS = ['adaptive'];
const SLIDERS = [
  { key: 'trees',  label: 'Деревья', min: 0, max: 900, step: 10, fmt: v => v + ' шт' },
  { key: 'glade',  label: 'Поляна', min: 0, max: 200, step: 2, fmt: v => v + ' px' },
  { key: 'sigma',  label: 'Ореол вокруг иконок', min: 40, max: 200, step: 1, fmt: v => v + ' px', act: 'field' },
];

/* ======================================================================
   Данные иконок и раскладок
   ====================================================================== */
const PAGE = '<path d="M12 4h17l9 9v29a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fbfbfb" stroke="#c4c4c4"/><path d="M29 4v7a2 2 0 0 0 2 2h7z" fill="#dedede"/>';
const LINES = '<path d="M24 20h10M24 25h10M24 30h10M24 35h10" stroke="#c9c9c9" stroke-width="1.6"/>';
const badge = (color, text, size = 11) => `<rect x="4" y="21" width="19" height="19" rx="3" fill="${color}"/><text x="13.5" y="34.5" text-anchor="middle" font-family="Noto Sans,Arial" font-weight="700" font-size="${size}" fill="#fff">${text}</text>`;
const SVG = {
  folder: '<path d="M4 12a3 3 0 0 1 3-3h11l4 4h19a3 3 0 0 1 3 3v2H4z" fill="#e09b1d"/><path d="M4 17h40v20a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#ffc83d"/><path d="M4 17h40v2.5H4z" fill="#ffd978"/>',
  docx: PAGE + LINES + badge('#185abd', 'W'),
  xlsx: PAGE + '<path d="M24 19h11v17H24zM24 24.5h11M24 30h11M29.5 19v17" stroke="#9ac9a9" stroke-width="1.3" fill="none"/>' + badge('#107c41', 'X'),
  pdf:  PAGE + LINES + badge('#d33a2c', 'PDF', 7.5),
  cad:  PAGE + LINES + badge('#2a7fd4', 'DWG', 7),
  txt:  PAGE + '<path d="M16 18h16M16 23h16M16 28h16M16 33h10" stroke="#9a9a9a" stroke-width="1.6"/>',
  png:  PAGE + '<rect x="14" y="17" width="20" height="17" rx="1.5" fill="#8fd0f5"/><path d="M14 30l6-6 5 5 3-3 6 6v1.5a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 14 34z" fill="#3fa35a"/><circle cx="29" cy="21.5" r="2" fill="#fff4b8"/>',
  shot: '<rect x="3" y="13" width="42" height="25" rx="1" fill="#1d2129" stroke="#f2f2f2" stroke-width="1.5"/><rect x="6" y="16" width="14" height="3" fill="#5b8def"/><rect x="6" y="21" width="22" height="2" fill="#6c7280"/><rect x="6" y="25" width="18" height="2" fill="#6c7280"/><rect x="31" y="16" width="11" height="18" fill="#2e3440"/>',
  zip:  PAGE + '<path d="M22 4v4h3v3h-3v3h3v3h-3v3h3v3h-3" stroke="#8a6d3b" stroke-width="2" fill="none"/><rect x="20" y="26" width="7" height="8" rx="1" fill="#8a6d3b"/>',
  bin:  '<path d="M12 14h24l-2.5 27a3 3 0 0 1-3 2.7H17.5a3 3 0 0 1-3-2.7z" fill="rgba(215,235,250,.55)" stroke="rgba(255,255,255,.9)" stroke-width="1.2"/><path d="M10 12.5h28" stroke="rgba(255,255,255,.95)" stroke-width="2.4" stroke-linecap="round"/><path d="M19 19l1 19M24 19v19M29 19l-1 19" stroke="rgba(255,255,255,.7)" stroke-width="1.2"/>',
  pc:   '<rect x="5" y="8" width="38" height="26" rx="2" fill="#1f8fe0" stroke="#bfe3ff" stroke-width="1.5"/><path d="M5 30h38" stroke="#0d5fa8" stroke-width="3"/><path d="M19 34l-2 6h14l-2-6z" fill="#9aa7b4"/>',
};
const APP_COLORS = ['#e8553e','#2f7de1','#18a058','#8b5cf6','#f59e0b','#0ea5a4','#db2777','#334155','#16a34a','#2563eb'];
function appSVG(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return `<rect x="5" y="5" width="38" height="38" rx="9" fill="${APP_COLORS[h % APP_COLORS.length]}"/><path d="M5 14a9 9 0 0 1 9-9h20a9 9 0 0 1 9 9v6H5z" fill="#fff" opacity=".14"/>` +
    `<text x="24" y="31.5" text-anchor="middle" font-family="Noto Sans,Arial" font-weight="700" font-size="18" fill="#fff">${[...name][0]}</text>`;
}
const glyphOf = (name, type) => type === 'app' ? appSVG(name) : SVG[type];

const FILES = [
  ['Корзина','bin'], ['Проекты','folder'], ['Смета 2026.xlsx','xlsx'], ['Требования.docx','docx'],
  ['Снимок_0927.png','png'], ['Договор скан.pdf','pdf'], ['Новая папка','folder'], ['Материалы','folder'],
  ['Фото из поездки','folder'], ['Установщик.zip','zip'], ['Протокол встречи.docx','docx'], ['Идеи обоев','folder'],
  ['Отчёт за неделю.xlsx','xlsx'], ['Эскиз.png','png'], ['Старый бэкап','folder'], ['Фото из чата.png','png'], ['Инструкция.pdf','pdf'], ['Резюме.docx','docx'], ['Расходы.xlsx','xlsx'], ['Архив.zip','zip'], ['Иллюстрация.png','png'], ['Загрузки','folder'], ['Стикеры.png','png'], ['Расчётный лист.xlsx','xlsx'], ['Договор аренды.pdf','pdf'], ['Дневник.docx','docx'], ['Снимок экрана.png','png'],
];
const EXTRA = [
  ['Новый документ.txt','txt'], ['Новая папка (2)','folder'], ['Счёт.pdf','pdf'], ['Выгрузка.xlsx','xlsx'],
  ['Снимок_0928.png','png'], ['Заметки.txt','txt'], ['Архив копия.zip','zip'], ['Новая папка (3)','folder'],
];
const APPS = ['Корзина','Мой компьютер','Telegram','Slack','Zoom','Google Meet','Spotify','CapCut','Photoshop','Obsidian','VS Code','Krita',
  'AutoCAD','Rhino','KeyShot','Dropbox','Chrome','Blender','Figma','Notion','Skype','Steam','Eagle','OBS','Kimi','PureRef','Запись экрана','NX 12.0','MarkText','Codex'];
const MISC = [['projects','folder'],['Игры','folder'],['todolist','folder'],['OKR.xlsx','xlsx'],['Постоянные расходы.xlsx','xlsx'],
  ['pdfarrange','app'],['stp.log','txt'],['Деталь.stp','txt'],['Деталь.3dm','png'],['Просмотр','folder']];
const RIGHT = [['plot.log','txt'],['Инструменты','folder'],['Архив.rar','zip'],['1685x128.png','png'],['Фото из чата.jpg','png'],['0914.png','png'],
  ['Фото из чата 2.jpg','png'],['images.png','png'],['Содержание.docx','docx'],['api.txt','txt'],['c4ef.png','png'],['0918.png','png'],
  ['Правка платы.pdf','pdf'],['recommend.txt','txt'],['button.stp','txt'],['Новый текст (2).txt','txt'],['ugstep21','txt'],['Новый текст (3).txt','txt'],
  ['План работ.txt','txt'],['Фото из чата 3.jpg','png'],['Новый DOCX.docx','docx'],['SEO.txt','txt'],['resend.txt','txt'],['Описание продукта.txt','txt'],
  ['USER.pdf','pdf'],['Новый текст.txt','txt'],['Стул.pur','png'],['PAP-20.pdf','pdf'],['Презентация.pptx','pdf'],['Замечания.txt','txt']];
function mineCells() {
  const out = []; let a = 0, m = 0, rgt = 0, sh = 0;
  for (let c = 0; c < 3; c++) for (let r = 0; r < 10; r++) {
    const name = APPS[a++];
    out.push([c, r, name, name === 'Корзина' ? 'bin' : name === 'Мой компьютер' ? 'pc' : 'app']);
  }
  for (let r = 0; r < 10; r++) out.push([3, r, ...MISC[m++]]);
  for (let r = 0; r < 5; r++) out.push([5, r, `Деталь ${r + 1}.dwg`, 'cad']);
  out.push([6, 0, 'Тест ноги.bak', 'txt']);
  for (const [c, r] of [[6,4],[6,5],[6,6],[6,7],[6,8],[7,3],[7,4],[7,5],[7,6],[7,7],[8,4],[8,5],[8,6],[9,2],[9,3],[9,4],[9,5],[9,6]])
    out.push([c, r, `ScreenShot ${++sh}.png`, 'shot']);
  for (const [c, r] of [[11,1],[11,2],[11,3],[12,1],[12,2],[12,3],[12,4],[13,1],[13,2],[13,3],[13,4],[14,1],[14,3],[14,4],[15,1],[15,6],
    [16,4],[16,6],[17,4],[17,5],[17,6],[17,7],[19,4],[19,5],[19,8],[20,0],[20,4],[20,6],[21,0],[21,5],[21,6]]) {
    const f = RIGHT[rgt++ % RIGHT.length]; out.push([c, r, f[0], f[1]]);
  }
  return out;
}

/* ======================================================================
   Шум на CPU и бесшовная текстура шума
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {

// Дерево ставится, если вокруг него нет иконок.
//
// Расстояние считаем прямо до прямоугольников иконок, а не по полю
// расстояний: поле `s` — безразмерная величина (на иконке оно около
// −12, в стороне 300), и порог в нём не переводится в пиксели
// наглядно. До прямоугольника — в пикселях, и поляну видно сразу.
function distToIcon(x, y) {
  let best = Infinity;
  for (const ic of icons) {
    // Расстояние от точки до прямоугольника иконки.
    const dx = Math.max(ic.x - x, 0, x - (ic.x + ic.w));
    const dy = Math.max(ic.y - y, 0, y - (ic.y + ic.h));
    const d = Math.hypot(dx, dy);
    if (d < best) best = d;
  }
  return best;
}

// Поляна: дерево не растёт ближе, чем на clearance пикселей к иконке.
function treeClear(x, y, radius) {
  return distToIcon(x, y) > radius + P.glade;
}

// Плотность леса: пятнами. Шум задаёт густые заросли и прогалины,
// иначе деревья стоят ровным ковром и лес выглядит разровненным.
// Значение нормировано к 0..1.
//
// Шум бесшовный (tileFbm): лес должен продолжаться за краями экрана, иначе
// на границе видна полоса обрыва.
function forestDensity(x, y) {
  const u = x / Math.max(W, 1), v = y / Math.max(H, 1);
  const n = tileFbm(u, v, [3, 6, 12], 91);
  // Значение НЕ обрезается в ноль: шум задаёт густоту зарослей, а не
  // выкашивает целые участки. Меньше 0.15 — почти пусто, больше 0.85 —
  // заросль. Полностью пустых мест быть не должно: на референсе лес
  // покрывает весь экран, и прогалины получаются только от иконок.
  return Math.min(1, Math.max(0.85, (n - 0.10) * 0.9));
}

// Расстановка.
//
// Ключевое: у каждого дерева есть постоянный номер (индекс в списке
// кандидатов). Номер не меняется при перестроении леса, поэтому можно
// отслеживать, какое дерево выросло, а какое ушло под землю, и не
// перерисовывать то, что не изменилось.
//
// Плотность задаётся шумом: деревья растут зарослями, а в прогалинах их
// нет вовсе. Вокруг иконок — поляна (см. treeClear).
//
// Кандидаты всегда одни и те же (зависят только от сида и экрана), а
// меняется лишь то, какие из них попадают в лес. Это позволяет при
// перетаскивании иконки обновлять лес частично.
const TREE_CAND = [];
function treeCandidates() {
  if (TREE_CAND.length && TREE_CAND.w === W && TREE_CAND.h === H) return TREE_CAND.list;
  const rnd = mulberry32((seed ^ 0x7a3f11) >>> 0);
  const list = [];
  // Запас кандидатов больше, чем деревьев: часть отсеется по шуму и по
  // взаимной близости.
  const n = Math.max(128, Math.ceil(P.trees * 5.0));
  for (let i = 0; i < n; i++) {
    const x = rnd() * W;
    const y = rnd() * (H - 60);
    const density = forestDensity(x, y);
    const kind = TREE_DRAW[Math.floor(rnd() * TREE_DRAW.length)];
    const depth = y / (H - 60);
    // Размер: ближе к низу экрана — крупнее (это глубина). Разброс внутри
    // — чтобы лес не состоял из деревьев одного калибра.
    // Размер снят с референса: крона изолированного дерева занимает
    // 4–5% ширины экрана. Деревья крупнее не должны появляться ни при
    // каком значении ползунка — иначе лес читается неправильно.
    // Высота дерева по замеру референса: 18–33% высоты экрана. Значит
    // s ≈ 2.6…4.8 при H = 46*s. Деревья мельче дают «рассаду», крупнее —
    // неправильный лес.
    // Деревья небольшие: втрое меньше, чем давал прежний масштаб.
    const scale = (0.77 + depth * 0.53) * (0.88 + rnd() * 0.26);
    list.push({ id: i, x, y, density, kind, scale, radius: 21 * scale, depth, ph: rnd() * TAU, grow: 0 });
  }
  TREE_CAND.list = list; TREE_CAND.w = W; TREE_CAND.h = H;
  return list;
}

// Перестроить лес и пометить для перерисовки изменившуюся область.
//
// Всё, что не изменилось, остаётся на прежнем холсте: перерисовывается
// только прямоугольник вокруг выросших и ушедших деревьев.
function rebuildForest() {
  const changed = buildTrees();
  for (const st of changed) {
    const b = treeBox(st);
    markDirty(b.x0 - 6, b.y0 - 6, b.x1 + 6, b.y1 + 6);
  }
  if (changed.length) {
    // Дерево, которое ушло под землю, освобождает место: под ним могут
    // быть другие деревья, их тоже надо перерисовать.
    for (const tr of trees) {
      const b = treeBox(tr);
      markDirty(b.x0 - 2, b.y0 - 2, b.x1 + 2, b.y1 + 2);
    }
  }
}

// Состояние дерева: где оно и насколько выросло (0..1).
// grow = 0 — дерево только-только проросло или уже ушло под землю.
const treeState = new Map();

// Список видимых деревьев в порядке отрисовки (дальние сверху).
let trees = [];

// Перестроить лес под текущее положение иконок.
//
// Возвращает список изменившихся деревьев: те, что выросли или ушли.
// Всё остальное остаётся на месте и не перерисовывается.
function buildTrees() {
  const cand = treeCandidates();
  const out = [];
  const changed = [];
  const live = new Set();

  // Сколько деревьев в лесу — ровно столько, сколько попросил ползунок.
  const limit = Math.max(0, Math.round(P.trees));
  if (limit === 0) {
    for (const st of treeState.values()) if (st.target !== 0) { st.target = 0; changed.push(st); }
    out.sort((a, b) => a.y - b.y);
    trees = out;
    return changed;
  }
  for (const c of cand) {
    if (out.length >= limit) break;
    if (c.density < 0) continue;
    // Плотность решает, растёт ли здесь дерево вообще.
    if (hash2(c.id, 7, 31) > c.density) continue;
    if (!treeClear(c.x, c.y, c.radius + 8)) continue;
    // Не ставим два дерева впритык: иначе лес превращается в стену.
    let tooClose = false;
    for (const t of out) {
      if (Math.hypot(t.x - c.x, t.y - c.y) < (t.radius + c.radius) * 0.14) { tooClose = true; break; }
    }
    if (tooClose) continue;

    let st = treeState.get(c.id);
    if (!st) {
      st = { grow: 0, target: 1, x: c.x, y: c.y, kind: c.kind, scale: c.scale, radius: c.radius, depth: c.depth, ph: c.ph };
      treeState.set(c.id, st);
      changed.push(st);
    } else {
      // Дерево на месте: переносим новые координаты, но рост не трогаем.
      st.x = c.x; st.y = c.y; st.kind = c.kind; st.scale = c.scale;
      st.radius = c.radius; st.depth = c.depth; st.ph = c.ph;
    }
    st.target = 1;
    live.add(c.id);
    out.push(st);
  }

  // Деревья, которые были, но теперь перекрыты иконкой, — уходят под землю.
  // Их надо оставить в списке отрисовки, иначе они исчезнут мгновенно, а
  // не уйдут под землю.
  for (const [id, st] of treeState) {
    if (live.has(id)) continue;
    if (st.target === 0) { out.push(st); continue; }   // уже уходит
    st.target = 0;
    changed.push(st);
    out.push(st);
  }

  out.sort((a, b) => a.y - b.y);
  trees = out;
  return changed;
}

// Продвинуть рост деревьев. Возвращает те, что изменились.
function stepTrees(dt) {
  const changed = [];
  // В заморозке (запись превью, снимок) время не идёт: деревья должны
  // быть уже выросшими, иначе на превью получается рассада.
  if (FREEZE) {
    for (const st of treeState.values()) {
      if (st.grow === st.target) continue;
      st.grow = st.target;
      changed.push(st);
    }
    return changed;
  }
  for (const st of treeState.values()) {
    if (st.grow === st.target) continue;
    // Растут медленнее, чем уходят: дерево заметно вырастает, но уходит
    // быстро — как будто его сдвигают.
    // Растёт за ~0.8 с, уходит быстрее — как будто дерево убирают.
    const rate = st.target > st.grow ? 1.3 : 2.4;
    const d = dt * rate;
    st.grow = st.target > st.grow ? Math.min(st.target, st.grow + d) : Math.max(st.target, st.grow - d);
    changed.push(st);
  }
  return changed;
}

// Дерево целиком ушло под землю — забываем о нём и убираем из списка
// отрисовки, иначе оно осталось бы на холсте навсегда.
function pruneTrees() {
  for (const [id, st] of treeState) {
    if (st.target === 0 && st.grow <= 0) {
      treeState.delete(id);
      const i = trees.indexOf(st);
      if (i >= 0) trees.splice(i, 1);
    }
  }
}

// Одно дерево.
//
// Шесть силуэтов по подборке плоских деревьев. У всех есть ствол: без него
// крона читается пятном, а не деревом. Крона не «шар»: это или овал,
// суженный кверху (капля, лист), или несколько кругов в одно пятно
// (облако), или купол с плоским низом.
//
// Свет — не отдельный круг внутри кроны, а заливка, обрезанная по её
// форме: иначе получается мяч в мяче.
function drawTree(g, t, sway) {
  const k = TREE_KINDS[t.kind];
  const grow = t.grow;
  const s = t.scale * (0.55 + 0.45 * grow);
  const x = t.x + sway * 1.8 * s, y = t.y;
  const [dark, mid, light] = k.tones;

  // Тень на земле.
  g.globalAlpha = 0.13;
  g.fillStyle = '#3a5a35';
  g.beginPath();
  g.ellipse(x + 3.5 * s, y + 1.2 * s, 10 * s, 2.8 * s, 0, 0, TAU);
  g.fill();
  g.globalAlpha = 1;

  // Хвойные чуть крупнее лиственных: на референсе они выше и заметнее.
  const H = 46 * s * grow * (k.form === 'cone' ? 1.12 : 1);
  // Ствол короткий и толстый: на подборке он занимает около десятой части
  // высоты. Длинный тонкий ствол превращает дерево в «ножку».
  const trunkH = H * 0.09;
  const trunkW = Math.max(2.0, 3.0 * s);

  // Ствол рисуется первым и всегда виден под кроной.
  g.fillStyle = k.trunk;
  g.fillRect(x - trunkW / 2, y - trunkH - H * 0.02, trunkW, trunkH + H * 0.02);

  // Крона: центр и размеры зависят от формы.
  const crownH = H - trunkH;
  const crownW = crownH / (k.ratio || 1.6);
  const cy = y - trunkH - crownH / 2;

  // Контур кроны — одна функция, чтобы свет можно было по ней обрезать.
  const crown = () => {
    g.beginPath();
    if (k.form === 'cone') {
      // Ёлка: ярусы-«юбки» снизу вверх.
      //
      // На листе-подборке низ яруса не зубчатая пила, а мягкая волна:
      // три-четыре округлых выступа. Острые зубцы читались гребёнкой,
      // поэтому низ рисуется дугами.
      const tiers = k.tiers || 4;
      const bottom = cy + crownH / 2;
      const halfW = crownW / 2;
      const step = crownH / (tiers + 0.30);
      const tierH = step * 1.85;
      for (let tier = 0; tier < tiers; tier++) {
        const yb = bottom - step * tier;               // низ юбки
        const w = halfW * (1 - tier / (tiers + 1.25));
        const h = tierH * (1 - tier * 0.06);
        g.fillStyle = tier === 0 ? dark : (tier % 2 ? mid : dark);
        g.beginPath();
        g.moveTo(x, yb - h);                            // вершина яруса
        // Правая сторона — прямая до края юбки.
        g.lineTo(x + w, yb - h * 0.10);
        // Низ юбки: три круглых выступа от края к центру.
        const lobes = 3;
        for (let l = 0; l < lobes; l++) {
          const u0 = 1 - l / lobes, u1 = 1 - (l + 1) / lobes;
          const mx = x + w * (u0 + u1) * 0.5;
          g.quadraticCurveTo(mx + w * 0.05, yb + h * 0.30, x + w * u1, yb - h * 0.10);
        }
        // Левая сторона зеркально.
        for (let l = 0; l < lobes; l++) {
          const u0 = l / lobes, u1 = (l + 1) / lobes;
          const mx = x - w * (u0 + u1) * 0.5;
          g.quadraticCurveTo(mx - w * 0.05, yb + h * 0.30, x - w * u1, yb - h * 0.10);
        }
        g.lineTo(x - w, yb - h * 0.10);
        g.closePath();
        g.fill();
      }
      return;
    }
    if (k.form === 'dome') {
      // Купол: широкая крона с округлым верхом и округлым низом.
      //
      // Раньше низ задавался почти прямой линией, и крона получалась
      // колоколом с плоским дном. Теперь это широкая капля: тот же
      // замкнутый контур, что у drop, но приземистее.
      const K = 0.5523;
      const r = crownW / 2, hh = crownH / 2;
      const apexY = cy - hh, midY = cy - hh * 0.06;
      g.moveTo(x, apexY);
      g.bezierCurveTo(x + r * 0.56, apexY, x + r, midY - hh * 0.58, x + r, midY);
      g.bezierCurveTo(x + r, midY + hh * 0.56, x + r * K, cy + hh, x, cy + hh);
      g.bezierCurveTo(x - r * K, cy + hh, x - r, midY + hh * 0.56, x - r, midY);
      g.bezierCurveTo(x - r, midY - hh * 0.58, x - r * 0.56, apexY, x, apexY);
      g.closePath();
      return;
    }
    if (k.form === 'cloud') {
      // Облако: несколько кругов, сбитых в одно пятно.
      //
      // Круги идут симметрично и с запасом внутрь: крайний справа раньше
      // вылезал за общий контур и оставлял «пузырь» сбоку.
      const r = crownW / 2, hh = crownH / 2;
      // Каждый круг начинается со своего moveTo. Без него canvas соединяет
      // эллипсы прямыми линиями от конца предыдущего к началу следующего —
      // сбоку кроны появлялся светлый «клюв».
      const lobe = (lx, ly, rx, ry) => {
        g.moveTo(lx + rx, ly);
        g.ellipse(lx, ly, rx, ry, 0, 0, TAU);
      };
      lobe(x, cy + hh * 0.16, r * 0.80, hh * 0.62);
      lobe(x - r * 0.42, cy + hh * 0.04, r * 0.52, hh * 0.50);
      lobe(x + r * 0.42, cy + hh * 0.04, r * 0.52, hh * 0.50);
      lobe(x - r * 0.18, cy - hh * 0.34, r * 0.50, hh * 0.48);
      lobe(x + r * 0.18, cy - hh * 0.34, r * 0.50, hh * 0.48);
      return;
    }
    // drop, leaf и column — овал; drop и leaf сужены кверху.
    const r = crownW / 2, hh = crownH / 2;
    if (k.form === 'column') {
      g.ellipse(x, cy, r, hh, 0, 0, TAU);
      return;
    }
    // Капля: замкнутая кривая — макушка, правый бок, низ, левый бок.
    //
    // Кривая начинается и заканчивается на макушке. Раньше она начиналась
    // сбоку ниже вершины, и на макушке оставался разрыв, а верх кроны
    // срезался плоско.
    //
    // Коэффициент 0.5523 — стандартная аппроксимация круга безье: низ и
    // макушка выходят круглыми, а не угловатыми.
    const K = 0.5523;
    const bw = r * (k.form === 'leaf' ? 0.94 : 1.0);       // полуширина
    const topW = bw * (k.form === 'leaf' ? 0.34 : 0.46);   // ширина макушки
    const apexY = cy - hh;                                  // вершина
    const midY = cy - hh * 0.12;                            // самая широкая часть
    g.moveTo(x, apexY);
    // Верх справа: от макушки к широкой части.
    g.bezierCurveTo(x + topW * 0.62, apexY,
                    x + bw, midY - hh * 0.52,
                    x + bw, midY);
    // Низ справа: настоящая четверть эллипса до нижней точки.
    g.bezierCurveTo(x + bw, midY + hh * 0.50,
                    x + bw * K, cy + hh,
                    x, cy + hh);
    // Низ слева.
    g.bezierCurveTo(x - bw * K, cy + hh,
                    x - bw, midY + hh * 0.50,
                    x - bw, midY);
    // Верх слева: обратно к макушке.
    g.bezierCurveTo(x - bw, midY - hh * 0.52,
                    x - topW * 0.62, apexY,
                    x, apexY);
    g.closePath();
  };

  // Тело кроны.
  g.fillStyle = mid;
  crown();
  g.fill();

  // Свет сверху и тень снизу — заливки, обрезанные по кроне.
  g.save();
  crown();
  g.clip();
  g.fillStyle = light;
  g.beginPath();
  g.ellipse(x - crownW * 0.06, cy - crownH * 0.34, crownW * 0.60, crownH * 0.46, 0, 0, TAU);
  g.fill();
  g.fillStyle = dark;
  g.globalAlpha = 0.55;
  g.beginPath();
  g.ellipse(x + crownW * 0.08, cy + crownH * 0.62, crownW * 0.62, crownH * 0.38, 0, 0, TAU);
  g.fill();
  g.globalAlpha = 1;

  // Прожилки листа.
  //
  // Как на картинке-образце: одна заметная центральная жила от ствола почти
  // до макушки и четыре пары боковых, идущих вниз под углом к краю. Раньше
  // жилы были короткие и бледные — на тёмной кроне их не было видно.
  if (k.form === 'leaf') {
    const hh = crownH / 2;
    g.strokeStyle = dark;
    g.globalAlpha = 0.55;
    g.lineCap = 'round';
    // Центральная жила — от ствола почти до макушки. На образце она
    // заметная и толстая, иначе при мелком размере не читается вовсе.
    g.lineWidth = Math.max(1.2, 1.9 * s);
    g.beginPath();
    g.moveTo(x, cy + hh * 0.96);
    g.lineTo(x, cy - hh * 0.90);
    g.stroke();
    // Боковые: три пары, плавно вниз-наружу, короче к макушке.
    g.lineWidth = Math.max(0.9, 1.25 * s);
    for (let n = 0; n < 3; n++) {
      const vy = cy - hh * 0.10 + n * hh * 0.26;
      const len = crownW * (0.30 - n * 0.055);
      g.beginPath();
      g.moveTo(x, vy);
      g.quadraticCurveTo(x - len * 0.6, vy + hh * 0.06, x - len, vy + hh * 0.16);
      g.moveTo(x, vy);
      g.quadraticCurveTo(x + len * 0.6, vy + hh * 0.06, x + len, vy + hh * 0.16);
      g.stroke();
    }
    g.lineCap = 'butt';
    g.globalAlpha = 1;
  }
  g.restore();
}

// Все деревья за кадр. Сортировка уже сделана при сборке.
function drawTrees(g, t) {
  for (const tr of trees) {
    // Качание от ветра: дальние деревья качаются сильнее (их видно
    // целиком), ближние — почти неподвижны.
    const amp = 0.5 + (1 - tr.depth) * 1.2;
    const sway = Math.sin(t * 0.0006 + tr.ph) * amp;
    drawTree(g, tr, sway);
  }
}

/* ======================================================================
   Иконки рабочего стола (DOM)
   ====================================================================== */
const desktop = document.getElementById('desktop');
let icons = [], layoutKind = 'mine', selected = null, drag = null, extraIdx = 0, layoutCapacity = 0;
const grid = { cols: 1, rows: 1 };
let DW = innerWidth, DH = innerHeight - TASKBAR;
const ripples = [];
function computeGrid() {

function resize() {

  // масштабе 150% это 1706,67, а innerWidth округляется до 1707. Иначе

  // становится мутной.

}

const T0 = performance.now();
let lastT = 0, fpsEMA = 0, frameN = 0, frameMs = 0;
const px = new Uint8Array(4);
let paused = false;                              // программа сообщила: окно развёрнуто / во весь экран → пауза
// В заморозке время кадра задаёт внешний код (window.__renderAt).

// Длительность последнего кадра в секундах — нужна для анимации роста.
let dtFrame = 0.033;

function draw(now) {

// Слой деревьев.
//
// Ключевая мысль: перерисовывать всё на каждом кадре — дорого, а при
// перетаскивании иконки меняется только область вокруг неё. Поэтому
// деревья рисуются в закадровый холст, и на экран выводится готовый

const treeLayer = document.createElement('canvas');

  if (typeof v.variant === 'string' && VARIANTS[v.variant] && v.variant !== variantId) {
    variantId = v.variant;
    if (!FREEZE) draw(performance.now());

  // Кнопка обновления в настройках: новый пейзаж. Рабочий стол и
  // предпросмотр используют один и тот же сид.
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false, adaptiveChanged = false, forestChanged = false;
  for (const k in v) {
    if ((!SLIDERS.some(s => s.key === k) && !DISPLAY_KEYS.includes(k)) || typeof v[k] !== typeof P[k] || P[k] === v[k]) continue;
    if (DISPLAY_KEYS.includes(k) && v[k] !== 0 && v[k] !== 1) continue;
    P[k] = v[k];
    if (k === 'adaptive') adaptiveChanged = true;
    if (k === 'sigma') field = true;
    // Число деревьев и размер поляны меняют сам лес: его надо собрать
    // заново, иначе ползунок не делает ничего.
    if (k === 'trees' || k === 'glade') forestChanged = true;

    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // физические пиксели → CSS-пиксели
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    iconsSeen = true;
    commit(first);                                // в первый раз облака медленно вырастают, дальше плавно идут за иконками
    first = false;
  };
  hostHandle = handle;
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
</script>
