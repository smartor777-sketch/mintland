<title>Mintland · Пляж</title>
<!--
  Mintland · тема «Пляж», плоская иллюстрация (чистый WebGL2, 2D,
  всё считается в каждом кадре)
  Ориентир по стилю: плоские цветовые пятна и напылённое зерно —
  как шелкография.
  - Поле суши (CPU, пересчитывается при изменении иконок): гауссовы
    «метаболы» плюс искажение шумом → расстояние до берега s; при
    перемещении иконок линия берега переходит плавно
  - Море: градиент зерна от синевы вдали к мятному у берега; на воде
    неровные светлые блики (гуще у берега, медленно плывут)
  - Волны: тонкая белая линия у кромки и водяная пыль со стороны моря;
    дальше — светлая линия прибоя, идущая к берегу; вода периодически
    набегает на песок
  - Песок: несколько полос мокрого песка (сиреневато-серого и
    розовато-серого) там, куда доходили волны, дальше — сухой
    кремово-белый
  - Каяки: медленно идут по глубокой воде и обходят сушу
-->
<style>

  .label {
    margin-top: 3px; max-width: 72px; font-size: 12px; line-height: 15px; color: #fff; text-align: center;

  /* Режим предпросмотра (?preview=1, в окне настроек): настоящие иконки

  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; }

  .seg button { background: none; border: 0; color: inherit; padding: 5px 0; border-radius: 5px; cursor: pointer; font: inherit; opacity: .75; white-space: nowrap; }
  .seg button:hover { opacity: 1; }
  .seg button.on { background: rgba(255,255,255,.17); opacity: 1; }
  .slider { margin-top: 9px; }
  .slider .row { display: flex; justify-content: space-between; }
  .slider .row span:last-child { opacity: .6; font-variant-numeric: tabular-nums; }

<script>

/* ======================================================================

// Значения по умолчанию должны совпадать с полем default темы «Пляж»

const SLIDERS = [

/* ======================================================================

const PAGE = '<path d="M12 4h17l9 9v29a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fbfbfb" stroke="#c4c4c4"/><path d="M29 4v7a2 2 0 0 0 2 2h7z" fill="#dedede"/>';

const badge = (color, text, size = 11) => `<rect x="4" y="21" width="19" height="19" rx="3" fill="${color}"/><text x="13.5" y="34.5" text-anchor="middle" font-family="Noto Sans,Arial" font-weight="700" font-size="${size}" fill="#fff">${text}</text>`;
const SVG = {

  bin:  '<path d="M12 14h24l-2.5 27a3 3 0 0 1-3 2.7H17.5a3 3 0 0 1-3-2.7z" fill="rgba(215,235,250,.55)" stroke="rgba(255,255,255,.9)" stroke-width="1.2"/><path d="M10 12.5h28" stroke="rgba(255,255,255,.95)" stroke-width="2.4" stroke-linecap="round"/><path d="M19 19l1 19M24 19v19M29 19l-1 19" stroke="rgba(255,255,255,.7)" stroke-width="1.2"/>',

}

const FILES = [
  ['Корзина','bin'], ['Проекты','folder'], ['Смета 2026.xlsx','xlsx'], ['Требования.docx','docx'],
  ['Снимок_0927.png','png'], ['Договор скан.pdf','pdf'], ['Новая папка','folder'], ['Материалы','folder'],

  ['Отчёт за неделю.xlsx','xlsx'], ['Эскиз.png','png'], ['Старый бэкап','folder'], ['Фото из чата.png','png'], ['Инструкция.pdf','pdf'], ['Резюме.docx','docx'], ['Расходы.xlsx','xlsx'], ['Архив.zip','zip'], ['Иллюстрация.png','png'], ['Загрузки','folder'], ['Стикеры.png','png'], ['Расчётный лист.xlsx','xlsx'], ['Договор аренды.pdf','pdf'], ['Дневник.docx','docx'], ['Снимок экрана.png','png'],
];
const EXTRA = [
  ['Новый документ.txt','txt'], ['Новая папка (2)','folder'], ['Счёт.pdf','pdf'], ['Выгрузка.xlsx','xlsx'],
  ['Снимок_0928.png','png'], ['Заметки.txt','txt'], ['Архив копия.zip','zip'], ['Новая папка (3)','folder'],
];
const APPS = ['Корзина','Мой компьютер','Telegram','Slack','Zoom','Google Meet','Spotify','CapCut','Photoshop','Obsidian','VS Code','Krita',
  'AutoCAD','Rhino','KeyShot','Dropbox','Chrome','Blender','Figma','Notion','Skype','Steam','Eagle','OBS','Kimi','PureRef','Запись экрана','NX 12.0','MarkText','Codex'];
const MISC = [['projects','folder'],['Игры','folder'],['todolist','folder'],['OKR.xlsx','xlsx'],['Постоянные расходы.xlsx','xlsx'],
  ['pdfarrange','app'],['stp.log','txt'],['Деталь.stp','txt'],['Деталь.3dm','png'],['Просмотр','folder']];
const RIGHT = [['plot.log','txt'],['Инструменты','folder'],['Архив.rar','zip'],['1685x128.png','png'],['Фото из чата.jpg','png'],['0914.png','png'],

function mineCells() {
  const out = []; let a = 0, m = 0, rgt = 0, sh = 0;
  for (let c = 0; c < 3; c++) for (let r = 0; r < 10; r++) {
    const name = APPS[a++];

  for (let r = 0; r < 10; r++) out.push([3, r, ...MISC[m++]]);
  for (let r = 0; r < 5; r++) out.push([5, r, `Деталь ${r + 1}.dwg`, 'cad']);
  out.push([6, 0, 'Тест ноги.bak', 'txt']);
  for (const [c, r] of [[6,4],[6,5],[6,6],[6,7],[6,8],[7,3],[7,4],[7,5],[7,6],[7,7],[8,4],[8,5],[8,6],[9,2],[9,3],[9,4],[9,5],[9,6]])

  for (const [c, r] of [[11,1],[11,2],[11,3],[12,1],[12,2],[12,3],[12,4],[13,1],[13,2],[13,3],[13,4],[14,1],[14,3],[14,4],[15,1],[15,6],

/* ======================================================================
   Шум на CPU и бесшовная текстура шума
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

    // обычно одна линия прибоя). Гаснет только у самой воды: если погасить
    // раньше, линия исчезала бы не дойдя до берега, и пыль на кромке
    // выглядела бы взявшейся из ниоткуда.
    float vis = (1.0 - ss(lam * 0.45, lam * 1.35, s)) * ss(0.0, 4.0, dd) * energy;
    // У берега волна ломается: линия толще и белее, позади больше
    // зернистой пыли
    float brk = 1.0 - ss(8.0, 55.0, s);
    float cw = wv * (1.0 + 0.8 * brk);
    float crest = (1.0 - ss(0.7 * cw, 1.9 * cw, dpx)) * vis * (0.55 + 0.4 * brk);
    float crestSpray = exp(-fr * lam / (7.0 * cw)) * vis * (0.25 + 0.4 * brk);        // зернистая пыль за линией прибоя
    // В момент касания берега — короткий всплеск пыли: продолжение
    // пришедшей волны, а не отдельный эффект
    float burst = exp(-fu * 4.5) * ss(0.0, 0.04, fu);
    float spray = exp(-dd / (6.0 * wv)) * burst * energy * 0.45;
    float foam = max(crest, step(g2, max(spray, crestSpray)));
    col = mix(col, uFoam, foam);
  } else {
    // ---------- Песок: сухой пляж и узкая постоянно мокрая полоса у воды ----------
    float wet = ss(-7.0 - 3.0 * shoreE, 1.0, s) * 0.2;
    col = mix(sandRamp((g1 - 0.5) * 0.1 * gAmt), uWetSand, wet * 3.0);
    col *= 1.0 - 0.03 * ss(0.4, 0.8, N(p, 900.0).r) * (1.0 - wet);               // на сухом песке — еле заметные крупные пятна
  }

  // ---------- Слои тонкой воды, набегающие на песок ----------
  // Одновременно три слоя: каждый идёт вперёд, замирает и откатывается,
  // и у каждого своя высшая точка. По переднему краю — зернистая белая
  // кромка, после отката остаётся медленно исчезающий мокрый след.
  // Даже самый высокий набег не доходит до иконок: их край примерно на
  // s ≈ -расстояние до берега, остаётся запас.
  // Множитель 0,25: при размахе прибоя 120 на открытом берегу вода
  // заходит примерно на 30 px — как и раньше, когда энергия считалась от
  // положения пикселя.
  float reachBase = min(uRunup * 0.25 * shoreE * (0.85 + 0.3 * N(p, 900.0).g), uSigma * 0.78);
  // Тонкая вода и мокрый след не обрываются на линии берега: они
  // продолжаются в море и плавно гаснут (на открытом берегу; в маленькой
  // луже волн нет)
  float wk = (1.0 - ss(2.0, 38.0, s)) * mix(1.0, energy, ss(2.0, 10.0, s));
  if ((s < 4.0 && reachBase > 0.5) || (s >= 4.0 && wk > 0.01)) {
    vec3 FILM = uWetSand, MARK = uWetSand * 0.97;
    float onSand = step(s, 4.0);                                                  // белая кромка — только на песке
    // Сетчатая пена, остающаяся после отката: уплывает в море вместе
    // с обратным потоком
    vec2 wl = worley((p - nrm * fu * 8.0) / 7.0);
    float laceNet = (1.0 - ss(0.03, 0.1, wl.y - wl.x)) * ss(0.4, 0.62, N(p + vec2(t * 2.0, 0.0), 120.0).g);
    float wetMem = 0.0, filmA = 0.0;
    vec4 layers[3];
    for (int j = 0; j < 3; j++) {
      float a = fu + float(j);                                                    // «возраст» слоя в периодах одной волны
      float amp = reachBase * (0.5 + 0.5 * hash(vec2(cyc - float(j), 3.7)));
      float front = a < 0.45 ? mix(3.0, -amp, 1.0 - pow(1.0 - a / 0.45, 2.2))    // набег: сначала быстро, потом медленнее
                             : mix(-amp, 3.0, ss(0.45, 1.4, a));                  // откат
      float reached = ss(-amp - 4.0, -amp + 12.0, sW);                         // край очень мягкий: без резкой линии
      wetMem = max(wetMem, reached * (1.0 - ss(0.45, 2.8, a)) * ss(0.2, 0.45, a));
      float alpha = a < 0.45 ? 0.42 : 0.42 * (1.0 - ss(0.45, 1.4, a));
      // При откате кромка истончается и не имеет чёткой границы: верхний
      // край постепенно растворяется, поэтому при пересечении со следующей
      // набегающей волной не возникает жёсткого угла (разрыва)
      float feather = 1.0 + 16.0 * ss(0.45, 1.1, a);
      filmA = max(filmA, ss(front - 1.0, front + feather, sW) * alpha * 1.6);
      layers[j].w = feather;
      layers[j].xyz = vec3(front, a, amp);
    }
    // Мокрый след: там, где побывала вода, песок чуть темнее и желтее —
    // совсем тонкий слой
    col = mix(col, MARK, wetMem * 0.18 * wk);
    // Набежавшая вода: где слои перекрываются, считается только самый
    // толстый (при перемножении слоёв картинка темнела бы). Песок под
    // водой становится желтовато-мокрым: частью умножением, чтобы сохранить
    // зерно нижнего слоя, частью прямым сдвигом к цвету мокрого песка.
    // Умножать на бирюзу нельзя: розоватый песок с бирюзой даёт серый, и
    // у берега появляется тёмная полоса.
    col = mix(col, mix(col * vec3(0.98, 0.96, 0.90), FILM, 0.6), filmA * wk);
    // Пену и кромки слоёв рисуем от старых к новым
    for (int j = 2; j >= 0; j--) {
      float front = layers[j].x, a = layers[j].y, amp = layers[j].z;
      float cov = ss(front - 1.0, front + layers[j].w, sW);
      float lace = laceNet * cov * ss(0.4, 0.6, a) * (1.0 - ss(0.7, 1.4, a)) * wk;
      col = mix(col, uFoam, lace * 0.75);
      float edgeK = a < 0.45 ? 1.0 : 1.0 - ss(0.45, 1.05, a);
      float d = sW - front;
      float lineE = (1.0 - ss(0.8 * wv, 1.9 * wv, abs(d - 0.9 * wv))) * edgeK * onSand;    // белая кромка набега
      float sprayE = exp(-max(d, 0.0) / (5.0 * wv)) * cov * edgeK * 0.5 * onSand;         // зернистая пыль за кромкой
      col = mix(col, uFoam, max(lineE * 0.95, step(g1, sprayE)));
    }
  }

  // ---------- Каяки ----------
  for (int i = 0; i < 4; i++) {
    if (float(i) >= uKayN) break;
    vec4 k = uKay[i];
    vec2 q = rot(-k.z) * (p - k.xy);
    if (dot(q, q) > 900.0) continue;
    float sd = hullSD(q);
    vec2 pd = paddleSD(q, k.w);
    // Сначала часть весла, скрытая под лодкой
    vec3 kc = col;
    float a = 0.0;
    float mh = ss(0.7, -0.7, sd);
    if (mh > 0.0) {
      float tt = clamp(q.x / 22.0, -1.0, 1.0);
      float wd = 5.4 * (1.0 - tt * tt);
      vec3 hull = mix(vec3(0.99, 0.84, 0.16), vec3(1.0, 0.93, 0.45), 1.0 - ss(0.2, 0.7, abs(q.y) / max(wd, 0.5)));
      hull = mix(hull, vec3(0.90, 0.64, 0.10), ss(0.78, 1.0, abs(q.y) / max(wd, 0.5)));
      // Белые кружки на палубе — крышки люков
      hull = mix(hull, vec3(0.97, 0.96, 0.9), 1.0 - ss(1.0, 1.6, length(q - vec2(13.0, 0.0))));
      hull = mix(hull, vec3(0.97, 0.96, 0.9), 1.0 - ss(1.0, 1.6, length(q - vec2(-12.0, 0.0))));
      // Кокпит
      hull = mix(hull, vec3(0.30, 0.24, 0.20), 1.0 - ss(0.0, 0.6, length((q - vec2(-1.0, 0.0)) / vec2(6.0, 2.8)) - 1.0));
      kc = mix(kc, hull, mh); a = max(a, mh);
    }
    // Человек: оранжевый спасжилет и тёмная голова
    float body = ss(0.5, -0.5, length(q - vec2(-1.5, 0.0)) - 3.3);
    kc = mix(kc, vec3(0.96, 0.55, 0.18), body);
    float head = ss(0.5, -0.5, length(q - vec2(0.2, 0.0)) - 2.0);
    kc = mix(kc, vec3(0.22, 0.17, 0.16), head);
    // Весло
    float sh = ss(0.5, -0.5, pd.x), bl = ss(0.5, -0.5, pd.y);
    kc = mix(kc, vec3(0.28, 0.24, 0.26), sh);
    kc = mix(kc, vec3(0.90, 0.28, 0.22), bl);
    col = kc;
  }

  // ---------- Чайки: белое тело, светло-серые крылья, чёрные кончики; летят высоко, тень ложится далеко ----------
  for (int i = 0; i < 8; i++) {
    if (float(i) >= uBirdN) break;
    vec4 b = uBird[i];
    vec2 d0 = p - b.xy, d1 = d0 - vec2(34.0, 55.0);
    if (dot(d1, d1) < 400.0) {
      vec3 g = gullSD(rot(-b.z) * d1, b.w);
      col = mix(col, col * vec3(0.70, 0.74, 0.84), ss(1.8, -1.8, min(g.x, g.y)) * 0.28);
    }
    if (dot(d0, d0) < 400.0) {
      vec3 g = gullSD(rot(-b.z) * d0, b.w);
      vec3 wingC = mix(vec3(0.80, 0.84, 0.88), vec3(0.20, 0.22, 0.26), ss(0.72, 0.8, g.z));
      col = mix(col, wingC, ss(0.6, -0.6, g.y));
      col = mix(col, vec3(0.99, 0.99, 0.98), ss(0.6, -0.6, g.x));
      col = mix(col, vec3(0.98, 0.78, 0.22), ss(0.5, -0.5, length(rot(-b.z) * d0 - vec2(7.2, 0.0)) - 0.9));   // жёлтый клюв
    }
  }

  if (uDebug > 0.5) col = mix(col, vec3(0.9, 0.15, 0.15), 1.0 - ss(0.0, 1.5, abs(s0)));
  // Ощущение печати: поверх всего — очень лёгкое зерно
  col *= 1.0 + (g2 - 0.5) * 0.035 * gAmt;
  o = vec4(col, 1.0);
}`;

const cv = document.getElementById('art');

function program(fs, vs = VS) {
  const mk = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); throw new Error('shader'); }
    return s;
  };

  gl.attachShader(p, mk(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  const U = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); U[nm] = gl.getUniformLocation(p, nm); }
  return { p, U };
}
const PR = program(FS);

  gl.generateMipmap(gl.TEXTURE_2D);

const f32 = new Float32Array(1), u32 = new Uint32Array(f32.buffer);
function toHalf(v) {
  f32[0] = v; const x = u32[0];
  const sign = (x >>> 16) & 0x8000, e = ((x >>> 23) & 0xff) - 112, m = x & 0x7fffff;
  if (e <= 0) return sign;
  if (e >= 31) return sign | 0x7c00;
  return sign | (e << 10) | (m >>> 13);

// Две текстуры поля суши: между ними интерполируем from → to
const ftex = [null, null];
let fromI = 0, toI = 0, morphT0 = -1e9, morphDur = MORPH_MS, FA = null, FB = null;
function allocField() {
  for (let i = 0; i < 2; i++) {
    if (ftex[i]) gl.deleteTexture(ftex[i]);
    ftex[i] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, Gw, Gh, 0, gl.RED, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

function uploadField(i, Fd) {
  const d = new Uint16Array(Gw * Gh);
  for (let k = 0; k < d.length; k++) d[k] = toHalf(Fd.s[k]);
  gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
  // R16F — 2 байта на пиксель. При нечётной ширине сетки длина строки не
  // кратна четырём, поэтому загружаем плотно упакованные данные как есть.
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

const iconRects = () => icons.map(ic => ({ cx: ic.x + ic.w / 2, cy: ic.y + ic.h / 2, hw: ic.w / 2 - 4, hh: ic.h / 2 - 2 }));
function commit(fromEmpty = false) {
  const nf = computeField(iconRects());
  const target = 1 - toI;
  if (fromEmpty) { FA = computeField([]); uploadField(toI, FA); }
  else FA = FB;
  FB = nf;
  uploadField(target, FB);
  fromI = toI; toI = target;
  morphT0 = performance.now();
  morphDur = fromEmpty ? 2600 : MORPH_MS;
}

  FA = FB = computeField(iconRects());
  uploadField(toI, FB);
  fromI = toI; morphT0 = -1e9;

/* ======================================================================
   Каяки: медленно идут по глубокой воде, заранее обходя сушу и друг друга
   ====================================================================== */
const kayaks = [];
let curMix = 1;
const curS = (x, y) => FB ? sampleArr(FA.s, x, y) * (1 - curMix) + sampleArr(FB.s, x, y) * curMix : 999;
function spawnKayak() {
  for (let t = 0; t < 400; t++) {
    const x = 60 + Math.random() * (W - 120), y = 60 + Math.random() * (H - TASKBAR - 120);
    if (curS(x, y) > 170 && kayaks.every(k => Math.hypot(k.x - x, k.y - y) > 160))
      return { x, y, h: Math.random() * Math.PI * 2, v: 7 + Math.random() * 4, ph: Math.random() * 6, wander: Math.random() * 100, fade: 0 };
  }
  return null;
}
function syncKayaks() {
  const want = Math.max(0, Math.min(4, Math.round(P.kayaks)));
  while (kayaks.length > want) kayaks.pop();
  while (kayaks.length < want) { const k = spawnKayak(); if (!k) break; kayaks.push(k); }
}
function stepKayaks(dt, now) {
  const clearance = 64; // корпус длиной 44 px; с веслом нужен запас
  const plans = [];
  for (let i = 0; i < kayaks.length; i++) {
    const k = kayaks[i];
    let heading = k.h;
    const ax = k.x + Math.cos(k.h) * 70, ay = k.y + Math.sin(k.h) * 70;
    const margin = ax < 40 || ay < 40 || ax > W - 40 || ay > H - TASKBAR - 40;
    if (curS(ax, ay) < 150 || margin) {
      // доворачиваем к более глубокой воде или к центру кадра
      let gx = curS(k.x + 10, k.y) - curS(k.x - 10, k.y), gy = curS(k.x, k.y + 10) - curS(k.x, k.y - 10);
      if (margin) { gx += (W / 2 - k.x) * 0.02; gy += ((H - TASKBAR) / 2 - k.y) * 0.02; }
      let d = Math.atan2(gy, gx) - k.h;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      heading += Math.sign(d) * Math.min(Math.abs(d), 0.7 * dt);
    } else {
      k.wander += dt * 0.3;
      heading += (vnoise(k.wander, i * 10) - 0.5) * 0.25 * dt;
    }
    const fx = Math.cos(k.h), fy = Math.sin(k.h);
    let steerX = Math.cos(heading), steerY = Math.sin(heading), speed = 1, avoiding = false;
    for (let j = 0; j < kayaks.length; j++) {
      if (i === j) continue;
      const other = kayaks[j], dx = other.x - k.x, dy = other.y - k.y;
      const distance = Math.hypot(dx, dy);
      if (distance > 210) continue;
      const rvx = Math.cos(other.h) * other.v - fx * k.v;
      const rvy = Math.sin(other.h) * other.v - fy * k.v;
      const closing = dx * rvx + dy * rvy;
      const ahead = Math.max(0, Math.min(7, -closing / Math.max(.01, rvx * rvx + rvy * rvy)));
      const closest = Math.hypot(dx + rvx * ahead, dy + rvy * ahead);
      const risk = Math.max(0, Math.min(1, (110 - distance) / 46),
        closing < 0 ? (1 - Math.min(1, closest / 90)) * (1 - ahead / 8) : 0);
      if (risk <= 0) continue;
      avoiding = true;
      // при встрече обе расходятся вправо; при пересечении или
      // обгоне обе отходят от другой лодки
      const awayX = distance > .001 ? -dx / distance : -fy;
      const awayY = distance > .001 ? -dy / distance : fx;
      steerX += (awayX * 2 - fy * 1.6) * risk;
      steerY += (awayY * 2 + fx * 1.6) * risk;
      if (dx * fx + dy * fy > 0 && closing < 0)
        speed = Math.min(speed, .25 + .75 * Math.max(0, Math.min(1, (distance - clearance) / 50)));
    }
    if (avoiding) {
      const d = Math.atan2(Math.sin(Math.atan2(steerY, steerX) - k.h), Math.cos(Math.atan2(steerY, steerX) - k.h));
      heading = k.h + Math.sign(d) * Math.min(Math.abs(d), dt);
    }
    k.ph += dt * 2.4;
    const v = k.v * (0.75 + 0.25 * Math.abs(Math.sin(k.ph))) * speed; // после гребка быстрее
    plans.push({ h: heading, dx: Math.cos(heading) * v * dt, dy: Math.sin(heading) * v * dt });
  }
  // Проверяем минимальные промежутки по маршрутам текущего кадра. При
  // опасном сближении лодка сбавляет ход и продолжает поворот, но не
  // отталкивается и не перескакивает.
  for (let pass = 0; pass < kayaks.length; pass++) {
    for (let i = 0; i < kayaks.length; i++) for (let j = i + 1; j < kayaks.length; j++) {
      const a = plans[i], b = plans[j], dx = kayaks[j].x - kayaks[i].x, dy = kayaks[j].y - kayaks[i].y;
      const vx = b.dx - a.dx, vy = b.dy - a.dy, vv = vx * vx + vy * vy;
      const dot = dx * vx + dy * vy;
      if (dot >= 0 || vv < 1e-12) continue;
      const closestAt = Math.max(0, Math.min(1, -dot / vv));
      if (Math.hypot(dx + vx * closestAt, dy + vy * closestAt) >= clearance) continue;
      const gap = dx * dx + dy * dy - clearance * clearance;
      const fraction = gap <= 0 ? 0 : Math.max(0, Math.min(1, gap / (-dot + Math.sqrt(Math.max(0, dot * dot - vv * gap))) - .001));
      a.dx *= fraction; a.dy *= fraction; b.dx *= fraction; b.dy *= fraction;
    }
  }
  for (let i = kayaks.length - 1; i >= 0; i--) {
    const k = kayaks[i], plan = plans[i];
    k.h = plan.h; k.x += plan.dx; k.y += plan.dy;
    if (curS(k.x, k.y) < 40) { const n = spawnKayak(); if (n) kayaks[i] = n; else kayaks.splice(i, 1); }   // «проглоченная» сушей лодка появляется в другом месте
  }
}

/* ======================================================================
   Чайки: парят над кадром, иногда кружат, иногда машут крыльями;
   ушедшие за край возвращаются
   ====================================================================== */
const birds = [];
const turnToward = (h, target, rate) => { let d = target - h; d = Math.atan2(Math.sin(d), Math.cos(d)); return h + Math.sign(d) * Math.min(Math.abs(d), rate); };
function spawnBird(fromEdge) {
  const H2 = H - TASKBAR;
  let x = Math.random() * W, y = Math.random() * H2;

function resize() {

  // масштабе 150% это 1706,67, а innerWidth округляется до 1707. Иначе

  // становится мутной.

  document.getElementById('clock').innerHTML = `${z(d.getHours())}:${z(d.getMinutes())}<br>${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}
setInterval(tickClock, 15000); tickClock();

/* ---------- Запуск ---------- */
window.__dbg = {
  P, applyLayout, kayaks, birds,
  bench() {
    const ts = [];
    for (let i = 0; i < 10; i++) { const a = performance.now(); draw(performance.now()); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); ts.push(performance.now() - a); }
    ts.sort((a, b) => a - b);
    return { frame: +ts[5].toFixed(1), canvas: cv.width + 'x' + cv.height, gpu: GPU };
  },
};
resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else { applyLayout('mine'); syncPanel(); }

// Хуки для инструментов (tools/capture-theme.py, tools/test-theme.py):
//   __renderAt(t) — нарисовать кадр на момент t мс и остановиться;
//   __inject(msg) — доставить сообщение хоста (icons/settings/pause).
// Кадр обязательно идёт через requestAnimationFrame: иначе WebKit не
// забирает содержимое WebGL-канваса в снимок, и превью получается пустым.
window.__renderAt = function (t) {
  frozenT = t;
  scheduleFrame();
};
window.__inject = function (m) { if (hostHandle) hostHandle(m); };

if (!FREEZE) scheduleFrame();

/* ======================================================================
   Управляемый режим: кадром управляет извне
   - обои (?wallpaper=1): сообщения приходят от процесса рабочего стола
   - предпросмотр (?preview=1): окно настроек (settings.html) шлёт их
     через postMessage в iframe
   Сообщения: icons (прямоугольники настоящих иконок в физических
   пикселях) / settings (параметры, можно частично) / reset (значения по
   умолчанию) / pause
   ====================================================================== */
// Применение настроек: берём только известные параметры. Параметры берега
// требуют пересчёта поля суши, разрешение — пересоздания холста, а число
// каяков — добавления или удаления лодок.
function applySettings(v) {
  // Кнопка обновления в настройках: новый пейзаж. Рабочий стол и
  // предпросмотр используют один и тот же сид.
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  // Пресет палитры: имя таблицы из PALETTES. Меняется на лету — перезагрузка
  // страницы не нужна, достаточно поменять uniforms в следующем кадре.
  if (typeof v.palette === 'string' && PALETTES[v.palette] && v.palette !== paletteId) {
    paletteId = v.palette;
    if (!FREEZE) draw(performance.now());
  }
  // Принимаем только параметры, которые есть на панели: убранные опции
  // (зерно, точность отрисовки) не действуют, даже если остались в старом
  // файле настроек.
  let field = false, kay = false, bird = false;
  for (const k in v) {
    if (!SLIDERS.some(s => s.key === k) || typeof v[k] !== typeof P[k] || P[k] === v[k]) continue;
    P[k] = k === 'palms' ? Math.max(0, Math.min(10, Math.round(Number.isFinite(v[k]) ? v[k] : DEFAULTS.palms))) : v[k];
    if (k === 'sigma' || k === 'warp') field = true;
    else if (k === 'kayaks') kay = true;
    else if (k === 'birds') bird = true;
  }
  if (field && FB) refresh();
  if (kay) syncKayaks();
  if (bird) syncBirds();
}

function drawGhosts() {
  const box = document.getElementById('ghosts');
  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

function startHostedMode() {
  document.body.classList.add('wall');
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  commit(true);                                   // сначала только море
  syncBirds(false);
  let first = true;
  const settlePaused = () => {
    if (!paused || !iconsSeen) return;
    curMix = 1; morphT0 = -1e9;                  // пауза замораживает только анимацию; первое поле и раскладку иконок надо завершить
    draw(performance.now());
  };
  const handle = m => {
    if (m.t === 'pause') {
      paused = PREVIEW ? false : m.v;
      settlePaused();
      if (!paused) scheduleFrame();               // возобновляем цикл после паузы
      return;
    }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // физические пиксели → CSS-пиксели
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // в первый раз суша «прорастает» из моря, дальше берег плавно сдвигается
    if (first) { curMix = 1; kayaks.length = 0; syncKayaks(); curMix = 0; first = false; }
    settlePaused();
  };
  hostHandle = handle;
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
</script>
<script src="share.js"></script>   <!-- публикация снимка и видео: иконки-образцы, имена плашками -->
